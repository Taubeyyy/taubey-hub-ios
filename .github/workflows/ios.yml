# Builds the iOS app on a Mac runner and publishes a TrollStore-ready .ipa as
# a GitHub release (tag build-<number>). Signed only with ldid and the
# entitlements - TrollStore does the rest when installing.
name: iOS build

on:
  push:
    # main makes a release; a design/* branch only builds and photographs
    # every screen, so a look can be checked before anything is installed
    branches: [main, 'design/**']
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # GitHub-OIDC: the build reports to the Claude hub on the server, no secret needed

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Build number
        run: echo "BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Tools
        run: brew install xcodegen ldid

      # Before Xcode: everything that can be checked without a screen fails
      # here, before ten minutes of build time are spent - above all reading
      # the server's answers.
      - name: Logic tests
        run: |
          set -o pipefail
          swiftc -O Shared/*.swift Tests/*.swift -o /tmp/logic 2>&1 | tee "$RUNNER_TEMP/build.log"
          /tmp/logic 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Taubey.xcodeproj -scheme Taubey \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=0.1.${{ env.BUILD }} \
            CURRENT_PROJECT_VERSION=${{ env.BUILD }} \
            build 2>&1 | tee -a "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*Taubey|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Taubey.app

      # Real push: Apple's push service only takes a token from an app of the
      # team whose key the server signs with. With the repository variable
      # APPLE_TEAM_ID set, the app is signed as that team's app; without it,
      # as before (TrollStore), and the app falls back to looking itself.
      - name: Sign with ldid and pack the IPA
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          APP=build/Build/Products/Release-iphoneos/Taubey.app
          ENT="$RUNNER_TEMP/Taubey.entitlements"
          cp Taubey/Taubey.entitlements "$ENT"
          if [ -n "$TEAM" ]; then
            /usr/libexec/PlistBuddy -c "Set :application-identifier $TEAM.com.taubey.hub" \
              -c "Set :com.apple.developer.team-identifier $TEAM" "$ENT"
            echo "signed for team $TEAM"
          fi
          ldid -S"$ENT" -Icom.taubey.hub "$APP/Taubey"
          ldid -e "$APP/Taubey"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Taubey.ipa Payload)
          ls -lh out/Taubey.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Taubey-${{ env.BUILD }}
          path: ios/out/Taubey.ipa

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ env.BUILD }}" out/Taubey.ipa \
            --title "Taubey Build ${{ env.BUILD }}" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

      - name: Errors at a glance
        if: failure()
        run: grep -E "error:|âœ— FAIL" "$RUNNER_TEMP/build.log" | head -80 || true

      # Tells Claude on the server (Claude app, project Taubey) how the build
      # went - it reads it with `dopa-ci --project taubey`. GitHub-OIDC: the
      # server checks repository and branch in the signed token.
      - name: Report to the Claude hub
        if: always() && github.ref == 'refs/heads/main'
        env:
          OK: ${{ job.status == 'success' && '1' || '0' }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dopa-hub" | jq -r .value) || exit 0
          NOTES=$(git log -1 --pretty=%s | head -c 280 | jq -sRr @uri)
          tail -c 1500000 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/ci.txt" 2>/dev/null || echo "kein Protokoll" > "$RUNNER_TEMP/ci.txt"
          curl -fsS -X PUT "https://dopa.taubey.com/api/hub/ci/taubey?run=${{ env.BUILD }}&job=build&ok=$OK" \
            -H "Authorization: Bearer $TOKEN" -H "X-Release-Notes: $NOTES" -H "Content-Type: text/plain" \
            --data-binary @"$RUNNER_TEMP/ci.txt" || true

  # Taps through the app in the simulator with sample data and uploads a
  # photo of every screen (artifact Screens-<run>) - the only way to see the
  # design without a phone in hand.
  ui:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Tour in the simulator
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shots"
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone 1[5-7][^(]*" | sed 's/ *$//')
          echo "Simulator: $DEVICE"
          TEST_RUNNER_SHOT_DIR="$RUNNER_TEMP/shots" xcodebuild test -project Taubey.xcodeproj -scheme Taubey \
            -destination "platform=iOS Simulator,name=$DEVICE" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui.log" | grep -E "error:|Test Case|failed|passed" | tail -40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screens-${{ github.run_number }}
          path: ${{ runner.temp }}/shots

      - name: Report to the Claude hub
        if: always() && github.ref == 'refs/heads/main'
        env:
          OK: ${{ job.status == 'success' && '1' || '0' }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dopa-hub" | jq -r .value) || exit 0
          grep -E "error:|Test Case|failed|passed" "$RUNNER_TEMP/ui.log" 2>/dev/null | tail -c 1500000 > "$RUNNER_TEMP/ci.txt" || echo "kein Protokoll" > "$RUNNER_TEMP/ci.txt"
          curl -fsS -X PUT "https://dopa.taubey.com/api/hub/ci/taubey?run=${{ github.run_number }}&job=ui&ok=$OK" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: text/plain" \
            --data-binary @"$RUNNER_TEMP/ci.txt" || true
