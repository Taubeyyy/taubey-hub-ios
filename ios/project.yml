# XcodeGen description - the Mac runner turns this into Taubey.xcodeproj.
# No Xcode on Windows; see .github/workflows/ios.yml.
name: Taubey
options:
  bundleIdPrefix: com.taubey
  deploymentTarget:
    iOS: "16.2"            # the iPhone runs 16.4.1 (TrollStore)
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"     # CI sets 0.1.<build>
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Taubey:
    type: application
    platform: iOS
    sources: [Taubey, Shared]
    info:
      path: Taubey/Info.plist
      properties:
        CFBundleDisplayName: Taubey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # taubey://open?view=… - a tapped Bark message opens the app on its tab
        # (every message comes through Bark since 2026-11-19; no background
        # refresh any more, the app sends nothing of its own)
        CFBundleURLTypes:
          - CFBundleURLName: com.taubey.hub
            CFBundleURLSchemes: [taubey]
        # TrollStore's install link, for updates from inside the app
        LSApplicationQueriesSchemes: [apple-magnifier]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taubey.hub
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Taubey/Taubey.entitlements
  TaubeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Taubey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taubey.hub.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Taubey:
    build:
      targets:
        Taubey: all
    test:
      targets:
        - TaubeyUITests
